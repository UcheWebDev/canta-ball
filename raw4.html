<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Recipient Bank Details</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans text-gray-900 antialiased">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-sm bg-white min-h-screen sm:min-h-[720px] sm:rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden relative">

        <!-- Header Section -->
        <div>
          

            <!-- Top Navigation Bar -->
            <div class="px-4 py-3 flex items-center justify-between border-b border-gray-100">
                <div class="w-12"></div> <!-- Spacer for symmetry -->
                <span class="text-sm font-semibold text-gray-800">Step 1 of 3</span>
                <a href="#" class="text-xs font-semibold text-[#1a5baf] hover:underline w-12 text-right">Cancel</a>
            </div>

            <!-- Main Form Content -->
            <div class="px-6 pt-6 pb-4 space-y-6">

                <!-- Avatar Icon -->
                <div class="flex justify-center">
                    <div class="relative inline-block">
                        <div class="w-14 h-14 bg-[#4182e4] rounded-t-full rounded-b-xl flex items-end justify-center overflow-hidden">
                            <i class="fa-solid fa-user text-white text-3xl mb-1"></i>
                        </div>
                        <div class="absolute -top-1 -right-1 bg-[#f5a623] text-white w-5 h-5 rounded-full flex items-center justify-center border-2 border-white text-xs font-bold">
                            +
                        </div>
                    </div>
                </div>

                <!-- Titles -->
                <div class="text-center space-y-2">
                    <h1 class="text-xl font-bold text-gray-900 tracking-tight">Add recipient bank details</h1>
                    <p class="text-xs text-gray-600 leading-relaxed max-w-[260px] mx-auto">
                        Make sure these details match your recipient's bank records.
                    </p>
                </div>

                <!-- Input Form -->
                <form class="space-y-5 pt-2">

                    <!-- Bank Country Dropdown -->
                    <div class="relative border-b border-gray-400 pb-1">
                        <label class="block text-xs text-gray-500 mb-1">Bank country</label>
                        <div class="flex items-center justify-between cursor-pointer">
                            <div class="flex items-center space-x-2">
                                <!-- Canadian Flag Icon -->
                                <span class="inline-flex items-center justify-center overflow-hidden w-5 h-3.5 border border-gray-200">
                                    <svg viewBox="0 0 640 480" class="w-full h-full">
                                        <g fill-rule="evenodd" stroke-width="1pt">
                                            <path fill="#f00" d="M0 0h160v480H0zM480 0h160v480H480z"/>
                                            <path fill="#fff" d="M160 0h320v480H160z"/>
                                            <path fill="#f00" d="M338.9 337.8l12 39.8-21.7-11.8-6.6 23.3-8.8-27-8.9 27-6.5-23.3-21.8 11.8 12-39.8-19.1-13 32.5-3.3 2.1-32.8 10.2 19 10.2-19 2.2 32.8 32.4 3.3z"/>
                                        </g>
                                    </svg>
                                </span>
                                <span class="text-sm font-medium text-gray-900">Canada</span>
                            </div>
                            <i class="fa-solid fa-chevron-down text-gray-500 text-xs"></i>
                        </div>
                    </div>

                    <!-- SWIFT Code / BIC Input -->
                    <div class="relative">
                        <label class="block text-xs text-gray-500 mb-1">SWIFT code/ BIC</label>
                        <div class="flex items-center border-b border-gray-400 pb-1">
                            <input 
                                type="text" 
                                class="w-full bg-transparent text-sm text-gray-900 focus:outline-none"
                            />
                            <button type="button" class="text-[#1a5baf] hover:text-blue-800 ml-2 focus:outline-none">
                                <i class="fa-regular fa-circle-question text-base"></i>
                            </button>
                        </div>
                        <p class="text-[11px] text-gray-500 mt-1 leading-snug">
                            Once you tell us a SWIFT code/ BIC, any changes you make will clear the info below.
                        </p>
                    </div>

                    <!-- Account Number Input -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Account number</label>
                        <div class="border-b border-gray-400 pb-1">
                            <input 
                                type="text" 
                                class="w-full bg-transparent text-sm text-gray-900 focus:outline-none"
                            />
                        </div>
                        <p class="text-[11px] text-gray-500 mt-1">Use only letters and/or numbers.</p>
                    </div>

                    <!-- Verify Account Number Input -->
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">Verify account number</label>
                        <div class="border-b border-gray-400 pb-1">
                            <input 
                                type="text" 
                                class="w-full bg-transparent text-sm text-gray-900 focus:outline-none"
                            />
                        </div>
                    </div>

                    <!-- Optional Routing Instructions -->
                    <div class="pt-2">
                        <button type="button" class="text-xs font-semibold text-[#1a5baf] hover:underline flex items-center space-x-1.5 focus:outline-none">
                            <i class="fa-regular fa-circle-plus text-sm"></i>
                            <span>Add other routing instructions (optional)</span>
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- Sticky Bottom CTA Button -->
        <div class="p-6 bg-white">
            <button 
                type="button" 
                class="w-full bg-[#1a5baf] hover:bg-[#154a8f] text-white font-semibold text-sm py-3 rounded-lg transition-colors focus:outline-none shadow-sm">
                Next
            </button>
        </div>

    </div>

</body>
</html>
