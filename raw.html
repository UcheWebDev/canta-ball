<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chase - Transaction History</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans text-gray-700 antialiased">

    <!-- Mobile Device Container -->
    <div class="w-full max-w-sm bg-white shadow-2xl overflow-hidden min-h-screen sm:min-h-[667px] sm:rounded-3xl flex flex-col">
        
    

      

        <!-- Transactions List -->
        <div class="flex-grow overflow-y-auto">

            <!-- SEPTEMBER 19 -->
            <div class="bg-[#e8ecef] text-center text-xs font-semibold text-gray-500 py-2 tracking-widest uppercase border-b border-gray-200">
                September 19
            </div>

            <!-- Target -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Target</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $49.03 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

            <!-- Whole Foods Market -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Whole Foods Market</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $217.34 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

            <!-- Online Transfer (Green) -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Online Transfer (...3896)</span>
                <span class="text-emerald-600 font-medium text-sm flex items-center gap-1">
                    $1,900.00 <i class="fa-solid fa-caret-up text-xs"></i>
                </span>
            </div>

            <!-- Pure Austin Fitness -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Pure Austin Fitness</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $25.00 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

            <!-- Online Transfer (Green) -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Online Transfer (...3896)</span>
                <span class="text-emerald-600 font-medium text-sm flex items-center gap-1">
                    $45.00 <i class="fa-solid fa-caret-up text-xs"></i>
                </span>
            </div>

            <!-- SEPTEMBER 18 -->
            <div class="bg-[#e8ecef] text-center text-xs font-semibold text-gray-500 py-2 tracking-widest uppercase border-b border-gray-200">
                September 18
            </div>

            <!-- Chase EPAY -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Chase EPAY</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $690.00 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

            <!-- Top Golf Austin -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Top Golf Austin</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $129.00 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

            <!-- Online Transfer (Green) -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Online Transfer (...3896)</span>
                <span class="text-emerald-600 font-medium text-sm flex items-center gap-1">
                    $200.00 <i class="fa-solid fa-caret-up text-xs"></i>
                </span>
            </div>

            <!-- Easy Tiger -->
            <div class="flex justify-between items-center px-4 py-3.5 border-b border-gray-200">
                <span class="font-bold text-gray-600 text-sm">Easy Tiger</span>
                <span class="text-red-500 font-medium text-sm flex items-center gap-1">
                    $29.23 <i class="fa-solid fa-caret-down text-xs"></i>
                </span>
            </div>

        </div>
    </div>

</body>
</html>
